name: Release and Publish
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on semantic version tags

jobs:
  release:
    runs-on: ubuntu-latest # npm trusted publishing needs a GitHub-hosted runner
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret is used
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x' # trusted publishing needs Node 22.14+ and npm 11.5.1+
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11 && npm --version

      - name: Check Tag Matches package.json Version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}. Tag v${VERSION}, or bump package.json first."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${VERSION}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests better_profanity==0.7.0

      - name: Generate Dictionary Data (from vendored, checksum-verified sources)
        run: python3 pipeline.py

      - name: Check Data Is Reproducible
        run: git diff --exit-code -- data/

      - name: Run Pipeline Tests (Python)
        run: python3 -m unittest test_pipeline.py

      - name: Run Integrity Tests (Node)
        run: npm test

      - name: Publish to npm (trusted publishing, provenance generated automatically)
        run: npm publish --access public

      - name: Package Assets
        run: zip -r dictionary-data.zip data/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dictionary-data.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
