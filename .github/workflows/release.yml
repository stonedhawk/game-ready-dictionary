name: Release and Publish
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on semantic version tags

jobs:
  release:
    runs-on: ubuntu-latest # npm trusted publishing needs a GitHub-hosted runner
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret is used
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x' # trusted publishing needs Node 22.14+ and npm 11.5.1+
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11 && npm --version

      - name: Check Tag Matches package.json Version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}. Tag v${VERSION}, or bump package.json first."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${VERSION}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests better_profanity==0.7.0

      - name: Generate Dictionary Data (from vendored, checksum-verified sources)
        run: python3 pipeline.py

      - name: Check Data Is Reproducible
        run: git diff --exit-code -- data/

      - name: Run Pipeline Tests (Python)
        run: python3 -m unittest test_pipeline.py

      - name: Run Integrity Tests (Node)
        run: npm test

      - name: Diagnose npm Trusted Publishing (OIDC exchange)
        # Prints the identity claims npm matches against and npm's verdict on the
        # token exchange. Never prints the ID token or the npm token.
        continue-on-error: true
        run: |
          ID_TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -p 'JSON.parse(require("fs").readFileSync(0)).value')"
          echo "::add-mask::${ID_TOKEN}"
          ID_TOKEN="${ID_TOKEN}" node -e '
            const c = JSON.parse(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url"));
            const keys = ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name", "runner_environment"];
            console.log(JSON.stringify(Object.fromEntries(keys.map(k => [k, c[k] ?? null])), null, 2));'
          STATUS="$(curl -sS -o oidc-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@rahulmrx%2fgame-ready-dictionary")"
          echo "npm OIDC exchange HTTP ${STATUS}"
          if [ "${STATUS}" = "200" ] || [ "${STATUS}" = "201" ]; then
            echo "Exchange succeeded (token not printed)."
          else
            node -p 'const b = require("fs").readFileSync("oidc-resp.json", "utf8"); try { const j = JSON.parse(b); j.message ?? j.error ?? b } catch { b }'
          fi
          rm -f oidc-resp.json

      - name: Publish to npm (trusted publishing, provenance generated automatically)
        run: npm publish --access public --loglevel verbose

      - name: Package Assets
        run: zip -r dictionary-data.zip data/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dictionary-data.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
